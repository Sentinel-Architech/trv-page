name: html-check

# Validates index.html and checks its links. Read-only; page content untouched.
# x.com is excluded: it returns 403 to all automated link checkers.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate HTML
        run: npx --yes html-validate@latest index.html
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --max-retries 2 --exclude '^https://(www\.)?(x|twitter)\.com' index.html
          fail: true
